stages:
  - build
  - test
  - deploy

.docker_build_template: &docker_build_template
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    APP_VERSION: $CI_COMMIT_TAG
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd src/$SERVICE_NAME
    - docker build -t $CI_REGISTRY_USER/aks-store-demo:$SERVICE_NAME-$APP_VERSION --build-arg APP_VERSION=$APP_VERSION .
    - docker push $CI_REGISTRY_USER/aks-store-demo:$SERVICE_NAME-$APP_VERSION
  only:
    - tags

build-order-service:
  <<: *docker_build_template
  variables:
    SERVICE_NAME: order-service
    APP_VERSION: $CI_COMMIT_TAG

build-product-service:
  <<: *docker_build_template
  variables:
    SERVICE_NAME: product-service
    APP_VERSION: $CI_COMMIT_TAG

build-store-front:
  <<: *docker_build_template
  variables:
    SERVICE_NAME: store-front
    APP_VERSION: $CI_COMMIT_TAG

unit-test-store-front:
  stage: test
  image: node:22.14
  variables:
    NODE_ENV: test
  script:
    - cd src/store-front
    - npm install
    - npm run test:unit
  only:
    - tags

test-order-service:
  stage: test
  image: node:18.20.5
  variables:
    NODE_ENV: test
  script:
    - cd src/order-service
    - npm install
    - npm run test
  only:
    - tags

test-product-service:
  stage: test
  image: rust:1.82.0-bullseye
  variables:
    NODE_ENV: test
  script:
    - cd src/product-service
    - cargo test -- --show-output
  only:
    - tags

deploy:
  stage: deploy
  before_script:
    - kubectl config use-context $KUBE_CONTEXT
    - chmod 400 $KUBECONFIG
    - helm repo add helm-charts $HELM_REPO --username $HELM_USER --password $HELM_PASS
    - helm pull aks-store-demo/aks-store-demo-chart --version $HELM_VERSION --untar
  script:
    - |
      helm upgrade \
        --install aks-store-demo aks-store-demo-chart/ \
        --namespace aks-store-demo \
        --create-namespace \
        --set orderService.image.tag=$CI_COMMIT_TAG \
        --set productService.image.tag=$CI_COMMIT_TAG \
        --set storeFront.image.tag=$CI_COMMIT_TAG \
        --set image.credentials.username=$DOCKER_REGISTRY_USER \
        --set image.credentials.password=$DOCKER_REGISTRY_PASSWORD \
        --set image.credentials.registry="https://index.docker.io/v1/" \
        --set image.credentials.email=$DOCKER_REGISTRY_EMAIL
  when: manual
  only:
    - tags
